# 渠道，可填写多个
[[providers]]
# （必填）渠道名：唯一、不能包含 "/"；作为模型引用 "渠道名/模型名" 的前缀。
name = "default"

# （可选）厂商.协议，缺省 "openai.chat"：
#   openai.chat      OpenAI Chat Completions（默认，兼容一切自定义端点/自建网关）
#   openai.responses OpenAI Responses API（要求端点支持 /responses）
#   anthropic        Anthropic Messages API（/v1/messages）
type = "openai.chat"

# （必填）自定义端点根地址（不含路径后缀，协议由 type 决定）。
#   例如 OpenAI 官方：https://api.openai.com/v1
#        Anthropic 官方：https://api.anthropic.com
#        自建网关/兼容服务：https://your-gateway.example.com/v1
base_url = ""

# （必填）API 密钥。
# 支持 ${ENV} 展开（整串引用，不支持拼接），变量可来自 ~/.zlite/.env
# 或 shell 环境（shell 中 export 的变量优先于 .env）。
# 推荐写到 ~/.zlite/.env：
#   ZLITE_DEFAULT_API_KEY=sk-xxxxxxxxxxxxxxxx
# 也可直接填明文（不推荐：密钥会落盘到配置文件）。
# 注意：未配置 api_key 的渠道视为未配置，启动时会进入首次引导。
api_key = "${ZLITE_DEFAULT_API_KEY}"

# （必填）模型列表：至少填一个，可多个（TUI 中 /switch 切换用）。
# 模型名可含 "/"（如 deepseek-ai/deepseek-chat），引用时渠道名取第一个 "/" 之前。
models = []

# ============================== agent 行为 ==============================
# 本节全部可选；不写则使用默认值。

[agent]
# （可选）工作模式：plan（只读，仅阅读/搜索）| build（可写，改文件/执行命令）。
# 默认 "plan"。运行中可用 Tab 或 /plan、/build 切换。
mode = "plan"

# （可选）默认模型引用 "provider_name/model_name"；缺省取第一个渠道的第一个模型。
# 引用的渠道与模型必须已在 [[providers]] 中配置，否则启动即报错。
default_model = ""

# （可选）信任模式：true = 跳过危险命令确认（谨慎开启）。
# 默认 false。
auto_approve = false

# （可选）单轮回答中工具调用循环的上限（防止模型无限循环）。默认 16。
max_steps = 16

# （可选）自动加载项目根目录 AGENTS.md 并注入系统提示词。默认 true。
load_agents_md = true

# ============================ shell 工具 ============================
# 本节可选。

[shell]
# （可选）build 模式下执行这些命令前缀时需要人工确认（危险命令清单）。
# 默认值如下，可按需增删（例如去掉 "git"，或追加 "docker"）。
# confirm_commands = ["rm", "mv", "dd", "mkfs", "sudo", "chmod", "git", "git-push"]

# （可选）追加到 plan 模式只读命令白名单的命令名（与内置白名单合并、去重）。
# 例如放行 python3/kubectl 供 plan 模式只读调用；默认空（仅内置白名单）。
# 注意：
#   - 仅放行命令名，shell 元字符（> ; & | $ 反引号 等）与 git 写子命令仍被禁止；
#   - 放行带写副作用参数的命令需谨慎：如 curl -o file 可写文件、curl -d @file 会上传
#     本地文件内容、curl 可访问内网地址（localhost/云元数据），放行后由用户自担风险。
plan_extra_commands = []

# ============================ MCP 集成 ============================
# 本节可选；不写则使用默认值。
# MCP（Model Context Protocol）让模型调用第三方 server 提供的工具（地图、
# GitHub、数据库等）。server 由第三方提供，zlite 只负责连接与调度。
# 配置使用官方生态通用的 JSON 格式（Claude Code / Cursor 的 mcpServers 约定），
# 网上教程的 mcpServers 片段可直接粘贴，零转换。工具以 "<server>_<tool>"
# 前缀注册（如 github_get_file_contents）。

[mcp]
# （可选）MCP 总开关。默认 true（设 false 可一键全关）。
enabled = true

# （可选）server 配置文件路径（支持 ~ 展开）。默认 "~/.zlite/mcp.json"。
# 文件不存在视为未配置 MCP，不影响启动。
file = "~/.zlite/mcp.json"

# （可选）同时启用的 server 数量上限；超出按 server 名排序丢弃后面的并警告。
# 默认 5。工具注入过多会稀释模型的工具选择，建议保持小值。
max_servers = 5

# （可选）单个 server 注入的工具数量上限；超出丢弃并警告。默认 20。
# GitHub 等大工具集 server 建议用工具子集参数裁剪（见下方示例），
# 或调大本值（代价：上下文 token 占用与工具选择精度下降）。
max_tools_per_server = 20


[tools]
# 联网搜索 / 网页抓取，默认启用，不需要请改为 false
web_search = true   
web_fetch = true